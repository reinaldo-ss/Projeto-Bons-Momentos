<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bons Momentos - Login Entregador</title>

    <link rel="stylesheet" href="login_app.css">
</head>
<body>
    <div class="app-frame login-frame">
        <div class="login-conteudo">

            <div class="login-logo">
                <svg viewBox="0 0 24 24"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 011 1v3h3l3 4v3.5h-2"/><path d="M9 17.5h6"/><path d="M5.5 17.5V10h9v3.5"/></svg>
            </div>

            <p class="login-boas-vindas">Bem vindo Entregador(a)</p>

            <form class="login-form" onsubmit="return false;">
                <input type="email" class="login-input" placeholder="Email" autocomplete="off">
                <input type="password" class="login-input" placeholder="Senha" autocomplete="off">
                <button type="submit" class="login-btn-entrar">Entrar</button>
            </form>

        </div>
    </div>
</body>
</html>
