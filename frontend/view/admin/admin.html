<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bons Momentos - Painel Administrador</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">

    <!--Importações-->
    <!--<script src="../../javascript/script.js" defer></script>-->
    <link rel="stylesheet" href="../../css/styleGlobal.css">
    <link rel="stylesheet" href="../../css/styleAdmin.css">
    
</head>
<body>
    <!-- Cabeçalho do administrador -->
    <section id="secao-header-admin" class="cor_fundo">
        <header class="cabecalho-admin content-section">
            <div class="orientacao-logo-admin">
                <img src="./img/logo_marrom.png" onerror="this.onerror=null; this.src='./img/logo_marrom.png';" class="logo" alt="Logo Bons Momentos">
                <div>
                    <h3 class="berkshire-swash-regular">Bons Momentos</h3>
                    <p>Painel Administrativo</p>
                </div>
            </div>

            <div class="admin-usuario">
                <div class="admin-identidade">
                    <span class="admin-avatar">A</span>
                    <div class="admin-info">
                        <p class="admin-nome">Administrador</p>
                        <p class="admin-cargo">Acesso total</p>
                    </div>
                </div>
                <button class="btn-sair" onclick="fazerLogout()">Sair</button>
            </div>
        </header>
    </section>

    <!-- Subnavegação do administrador -->
    <section class="admin-subnav-section">
        <div class="content-section admin-subnav">
            <nav class="admin-nav">
                <a class="admin-nav-link ativo" onclick="carregarPagina('admin')">Cardápio</a>
                <a class="admin-nav-link" onclick="carregarPagina('motoboys')">Motoboys</a>
                <a class="admin-nav-link" onclick="carregarPagina('historicoPedidos')">Histórico de Pedidos</a>
            </nav>
        </div>
    </section>

    <!-- Conteúdo principal -->
    <section>
        <div class="content-section admin-conteudo">
            <div class="admin-topo">
                <div>
                    <p class="admin-titulo">Cardápio</p>
                    <p class="admin-subtitulo">Gerencie o catálogo completo de receitas da confeitaria</p>
                </div>
            </div>

            <!-- Barra de ações -->
            <div class="admin-acoes">
                <button class="btn-novo-receita" onclick="carregarPagina('cadastrarReceita')">+ Nova receita</button>

                <div class="admin-buscar">
                    <input type="text" id="input-buscar-receita" placeholder="Buscar receita...">
                </div>

                <button class="btn-filtros">Pesquisar</button>
            </div>

            <!-- Tabela de receitas -->
            <div class="admin-tabela-wrapper">
                <table class="admin-tabela">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Ingredientes</th>
                            <th>Preço</th>
                            <th class="col-acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela-admin">
                       
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>
</html>
