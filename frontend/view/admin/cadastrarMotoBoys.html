<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bons Momentos - Cadastrar Motoboy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">

    <!--Importações-->
    <script src="../../javascript/script.js"></script>
    <link rel="stylesheet" href="../../css/styleCadMotoboys.css">
    <link rel="stylesheet" href="../../css/styleGlobal.css">

</head>
<body>
    <section>
        <div class="content-section section-cadastro-cad-motoboy">
            <div class="tela-geral-cad-motoboy">
                <div class="info-lateral-cad-motoboy">
                    <a id="sair-cad-motoboy" onclick="carregarPagina('motoboys')"> < </a>

                    <div id="texto-central-cad-motoboy">
                        <img class="logo2" src="./img/logo_branca.png" onerror="this.onerror=null; this.src='./img/logo_branca.png';" alt="Logo do Bons Momentos">
                            <div>
                                <p class="berkshire-swash-regular titulo-logo-cad-motoboy">Bons Momentos</p>
                                <p>Cadastre um motoboy</p>
                            </div>
                    </div>
                </div>

                <div class="cadastro-dados cadastro-dados-motoboy-cad-motoboy">
                    <p id="titulo-cadastro-cad-motoboy">Formulário Cadastrar Motoboy</p>

                    <form id="formCadastrarMotoboy">
                        <div class="linha-divisoria-cad-motoboy"></div>

                        <div class="inputs-gerais-cad-motoboy">
                            <label for="nome">Nome completo</label>
                            <div class="grupo-input-cad-motoboy">
                                <svg class="icone-input" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                                <input type="text" id="nome" name="nome" placeholder="Nome completo do motoboy" maxlength="255" />
                            </div>
                            <span class="msg-erro-cad" id="erro-nome"></span>
                        </div>

                        <div class="linha-dupla-inputs-cad-motoboy">
                            <div class="inputs-gerais-cad-motoboy">
                                <label for="cpf">CPF</label>
                                <div class="grupo-input-cad-motoboy">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                    <input type="text" id="cpf" name="cpf" placeholder="00000000000" maxlength="11" />
                                </div>
                                <span class="msg-erro-cad" id="erro-cpf"></span>
                            </div>
                            <div class="inputs-gerais-cad-motoboy">
                                <label for="telefone">Telefone</label>
                                <div class="grupo-input-cad-motoboy">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.13 6.13l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                                    <input type="tel" id="telefone" name="telefone" placeholder="00000000000" maxlength="11" />
                                </div>
                                <span class="msg-erro-cad" id="erro-telefone"></span>
                            </div>
                        </div>

                        <div class="linha-dupla-inputs-cad-motoboy">
                            <div class="inputs-gerais-cad-motoboy">
                                <label for="cnh">CNH</label>
                                <div class="grupo-input-cad-motoboy">
                                    <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" ry="2"/><circle cx="8" cy="12" r="2"/><line x1="13" y1="10" x2="19" y2="10"/><line x1="13" y1="14" x2="19" y2="14"/></svg>
                                    <input type="text" id="cnh" name="cnh" placeholder="00000000000" maxlength="11" />
                                </div>
                                <span class="msg-erro-cad" id="erro-cnh"></span>
                            </div>
                            <div class="inputs-gerais-cad-motoboy">
                                <label for="placa">Placa do veículo</label>
                                <div class="grupo-input-cad-motoboy">
                                    <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2" ry="2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
                                    <input type="text" id="placa" name="placa" placeholder="ABC1D23" maxlength="7" />
                                </div>
                                <span class="msg-erro-cad" id="erro-placa"></span>
                            </div>
                        </div>

                        <div class="inputs-gerais-cad-motoboy">
                            <label for="senha">Senha</label>
                            <div class="grupo-input-cad-motoboy">
                                <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                                <input type="password" id="senha" name="senha" placeholder="••••••••" />
                            </div>
                            <span class="msg-erro-cad" id="erro-senha"></span>
                        </div>

                        <div class="linha-divisoria-cad-motoboy"></div>

                        <div class="acoes-motoboy-cad-motoboy">
                            <button type="button" class="botao-voltar-cad-motoboy" onclick="carregarPagina('motoboys')">Voltar</button>
                            <button type="submit" id="btn-submit-motoboy" class="botao-cadastrar-cad-motoboy">Cadastrar motoboy</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
