<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bons Momentos - Painel da Cozinha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">

    <!-- Importações -->
    <!--<script src="../../javascript/script.js" defer></script>-->
    <link rel="stylesheet" href="../../css/styleGlobal.css">
    <link rel="stylesheet" href="../../css/styleAdmin.css">
    <link rel="stylesheet" href="../../css/styleCozinha.css">
</head>
<body>
    <!-- Cabeçalho da cozinha -->
    <section id="secao-header-cozinha" class="cor_fundo">
        <header class="cz-cabecalho content-section">
            <div class="cz-orientacao-logo">
                <img src="../../img/logo_marrom.png" onerror="this.onerror=null; this.src='../../img/logo_marrom.png';" class="logo" alt="Logo Bons Momentos">
                <div>
                    <h3 class="berkshire-swash-regular">Bons Momentos</h3>
                    <p>Painel da Cozinha</p>
                </div>
            </div>

            <div class="cz-usuario">
                <div class="cz-identidade">
                    <span class="cz-avatar">C</span>
                    <div class="cz-info">
                        <p class="cz-nome">Cozinha</p>
                        <p class="cz-cargo">Preparo de pedidos</p>
                    </div>
                </div>
                <button class="cz-btn-sair" onclick="fazerLogout()">Sair</button>
            </div>
        </header>
    </section>

    <!-- Área principal: Pedidos + menu lateral -->
    <section>
        <div class="content-section cz-conteudo-cozinha">

            <div class="cz-topo-secao">
                <h1 class="cz-titulo-pagina" id="cz-titulo-secao">Pedidos</h1>
                <p class="cz-subtitulo-pagina" id="cz-subtitulo-secao">Gerencie os pedidos em andamento na cozinha</p>
            </div>

            <div class="cz-layout">
                <!-- Conteúdo fixo de Pedidos -->
                <div id="cz-area-principal" class="cz-area-principal">
                    <div class="cz-pedidos-conteudo">
                        <div class="cz-kanban">
                            <div class="cz-coluna">
                                <p class="cz-coluna-titulo">A fazer</p>
                                <div class="cz-coluna-cards" id="cz-coluna-fazer">
                                    
                                </div>
                            </div>

                            <div class="cz-coluna">
                                <p class="cz-coluna-titulo">Em Preparo</p>
                                <div class="cz-coluna-cards" id="cz-coluna-fazendo">
                                    
                                </div>
                            </div>

                            <div class="cz-coluna">
                                <p class="cz-coluna-titulo">Pedidos Prontos</p>
                                <div class="cz-coluna-cards" id="cz-coluna-entrega">
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <nav class="cz-menu-lateral">
                    <a href="cozinha.html" class="cz-menu-item ativo">Pedidos</a>
                    <a href="historicoPedidosCozinha.html" class="cz-menu-item" onclick="if(document.getElementById('conteudo')){ event.preventDefault(); carregarPagina('historicoPedidosCozinha'); }">Histórico de Pedidos</a>
                </nav>
            </div>
        </div>
    </section>
</body>
</html>
