<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bons Momentos - Detalhes da Receita</title>

    <!--Importações-->
    <script src="../javascript/script.js" defer></script>
    <link rel="stylesheet" href="../css/styleDetalhe.css">
    <link rel="stylesheet" href="../css/styleGlobal.css">

</head>
<body>
    <section>
        <div class="content-section detalhe-container">

            <a class="detalhe-voltar" onclick="carregarPagina('cardapio')">‹ Voltar</a>

            <div class="detalhe-grid">

                <!-- Coluna esquerda: foto grande da receita -->
                <div class="detalhe-galeria">
                    <img class="detalhe-foto-grande" src="https://placehold.co/800x500?text=Bolo+de+Chocolate" alt="Foto da receita" id="detalhe-foto-principal">
                </div>

                <!-- Coluna direita: informações da receita -->
                <div class="detalhe-info">
                    <h2 class="detalhe-nome" id="detalhe-nome-titulo">Bolo de Chocolate</h2>
                    <p class="detalhe-preco" id="detalhe-preco">R$ 45,90</p>

                    <div class="detalhe-descricao">
                        <p class="detalhe-subtitulo">Descrição</p>
                        <p class="detalhe-texto" id="detalhe-descricao-texto">
                            Bolo fofinho de chocolate com cobertura cremosa de brigadeiro.
                        </p>
                    </div>

                    <div class="detalhe-descricao">
                        <p class="detalhe-subtitulo">Ingredientes</p>
                        <p class="detalhe-texto" id="detalhe-ingredientes-texto">
                            Farinha, chocolate 70%, ovos, leite, açúcar.
                        </p>
                    </div>

                    <a class="btn-comprar" onclick="carregarPagina('finalCompra')">Comprar</a>

                    <a class="btn-whatsapp" id="btn-whatsapp-dinamico" href="https://wa.me/5511900000000?text=Ol%C3%A1!%20Tenho%20interesse%20na%20receita%20Bolo%20de%20Chocolate%20anunciada%20na%20Bons%20Momentos." target="_blank" rel="noopener">
                        <img src="./img/whatsapp.svg" alt="WhatsApp" width="22" height="22">
                        Consultar encomenda pelo WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
