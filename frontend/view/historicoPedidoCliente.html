<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bons Momentos - Meus Pedidos</title>

    <!--Importações-->
    <script src="../javascript/script.js" defer></script>
    <link rel="stylesheet" href="../css/styleHistoricoCliente.css">
    <link rel="stylesheet" href="../css/styleGlobal.css">

</head>
<body>
    <section>
        <div class="content-section pedidos-cliente-conteudo">

            <div class="pedidos-cliente-topo">
                <p class="pedidos-cliente-titulo">Meus Pedidos</p>
                <p class="pedidos-cliente-subtitulo">Acompanhe o histórico das suas compras na Bons Momentos</p>
            </div>

            <div class="pedidos-cliente-lista" id="lista-pedidos-cliente">
                <div class="pedido-cliente-card">
                    <img class="pedido-cliente-foto" src="https://placehold.co/100x100?text=Bolo" alt="Bolo de Chocolate">
                    <div class="pedido-cliente-info">
                        <p class="pedido-cliente-nome">Bolo de Chocolate</p>
                        <p class="pedido-cliente-data">Pedido em 2026-09-08</p>
                        <p class="pedido-cliente-pagamento">PIX</p>
                    </div>
                    <div class="pedido-cliente-status">
                        <span class="status-pill status-pendente">Pendente</span>
                        <p class="pedido-cliente-preco">R$ 45,90</p>
                    </div>
                </div>
                <div class="pedido-cliente-card">
                    <img class="pedido-cliente-foto" src="https://placehold.co/100x100?text=Torta" alt="Torta de Morango">
                    <div class="pedido-cliente-info">
                        <p class="pedido-cliente-nome">Torta de Morango</p>
                        <p class="pedido-cliente-data">Pedido em 2026-09-05</p>
                        <p class="pedido-cliente-pagamento">Cartão</p>
                    </div>
                    <div class="pedido-cliente-status">
                        <span class="status-pill status-entregue">Entregue</span>
                        <p class="pedido-cliente-preco">R$ 52,50</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
