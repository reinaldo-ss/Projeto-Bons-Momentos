<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bons Momentos - Cadastro Cliente</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">

    <!--Importações-->
    <!-- <script src="../javascript/script.js" defer></script> -->
    <link rel="stylesheet" href="../css/styleCadCliente.css">
    <link rel="stylesheet" href="../css/styleGlobal.css">

</head>
<body>
    <section>
        <div class="content-section section-cadastro-cad-cliente">
            <div class="tela-geral-cad-cliente">
                <div class="info-lateral-cad-cliente">
                    <a id="sair-cad-cliente" onclick="carregarPagina('cardapio')"> < </a>

                    <div id="texto-central-cad-cliente">
                        <img class="logo2" src="./img/logo_branca.png" onerror="this.onerror=null; this.src='./img/logo_branca.png';" alt="Logo do Bons Momentos">
                            <div>
                                <p class="berkshire-swash-regular titulo-logo-cad-cliente">Bons Momentos</p>
                                <p>Doçura feita com amor</p>
                            </div>
                    </div>
                </div>

                <div class="cadastro-dados-cad-cliente">
                    <p id="titulo-cadastro-cad-cliente">Formulário Cadastro Cliente</p>
                    <form id="formCadastrarCliente" method="POST" novalidate>
                        <div class="linha-divisoria-cad-cliente"></div>

                        <div class="inputs-gerais-cad-cliente">
                            <label for="nome">Nome completo</label>
                            <div class="grupo-input-cad-cliente">
                                <svg class="icone-input" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" maxlength="255" />
                            </div>
                            <span class="msg-erro-cad" id="erro-nome"></span>
                        </div>

                        <div class="linha-dupla-inputs-cad-cliente">
                            <div class="inputs-gerais-cad-cliente">
                                <label for="email">E-mail</label>
                                <div class="grupo-input-cad-cliente">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" maxlength="255" />
                                </div>
                                <span class="msg-erro-cad" id="erro-email"></span>
                            </div>
                            <div class="inputs-gerais-cad-cliente">
                                <label for="telefone">Telefone</label>
                                <div class="grupo-input-cad-cliente">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.13 6.13l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                                    <input type="tel" id="telefone" name="telefone" placeholder="00000000000" maxlength="11" />
                                </div>
                                <span class="msg-erro-cad" id="erro-telefone"></span>
                            </div>
                        </div>

                        <div class="linha-dupla-inputs-cad-cliente">
                            <div class="inputs-gerais-cad-cliente">
                                <label for="senha">Senha</label>
                                <div class="grupo-input-cad-cliente">
                                    <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                                    <input type="password" id="senha" name="senha" placeholder="••••••••" />
                                </div>
                                <span class="msg-erro-cad" id="erro-senha"></span>
                            </div>
                            <div class="inputs-gerais-cad-cliente">
                                <label for="dataNascimento">Data de nascimento</label>
                                <div class="grupo-input-cad-cliente">
                                    <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                    <input type="date" id="dataNascimento" name="dataNascimento" />
                                </div>
                                <span class="msg-erro-cad" id="erro-dataNascimento"></span>
                            </div>
                        </div>

                        <div class="linha-divisoria-cad-cliente"></div>

                        <div class="linha-tripla-inputs-cad-cliente">
                            <div class="inputs-gerais-cad-cliente">
                                <label for="cep">CEP</label>
                                <div class="grupo-input-cad-cliente">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0112 2a8 8 0 018 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
                                    <input type="text" id="cep" name="cep" placeholder="00000000" maxlength="8" />
                                </div>
                                <span class="msg-erro-cad" id="erro-cep"></span>
                            </div>
                            <div class="inputs-gerais-cad-cliente">
                                <label for="cidade">Cidade</label>
                                <div class="grupo-input-cad-cliente">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0112 2a8 8 0 018 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
                                    <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" maxlength="50" />
                                </div>
                                <span class="msg-erro-cad" id="erro-cidade"></span>
                            </div>
                            <div class="inputs-gerais-cad-cliente">
                                <label for="bairro">Bairro</label>
                                <div class="grupo-input-cad-cliente">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0112 2a8 8 0 018 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
                                    <input type="text" id="bairro" name="bairro" placeholder="Seu bairro" maxlength="50" />
                                </div>
                                <span class="msg-erro-cad" id="erro-bairro"></span>
                            </div>
                        </div>

                        <div class="linha-dupla-inputs-cad-cliente">
                            <div class="inputs-gerais-cad-cliente">
                                <label for="endereco">Endereço</label>
                                <div class="grupo-input-cad-cliente">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                                    <input type="text" id="endereco" name="endereco" placeholder="Rua, avenida..." maxlength="150" />
                                </div>
                                <span class="msg-erro-cad" id="erro-endereco"></span>
                            </div>
                            <div class="inputs-gerais-cad-cliente">
                                <label for="numero">Número</label>
                                <div class="grupo-input-cad-cliente">
                                    <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/></svg>
                                    <input type="text" id="numero" name="numero" placeholder="Nº" maxlength="10" />
                                </div>
                                <span class="msg-erro-cad" id="erro-numero"></span>
                            </div>
                        </div>

                        <div class="inputs-gerais-cad-cliente">
                            <label for="complemento">Complemento (opcional)</label>
                            <div class="grupo-input-cad-cliente">
                                <svg class="icone-input" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
                                <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco, referência..." maxlength="100" />
                            </div>
                        </div>

                        <div class="linha-divisoria-cad-cliente"></div>

                        <div class="acoes-cliente-cad-cliente">
                            <button type="button" class="botao-voltar-cad-cliente" onclick="carregarPagina('cardapio')">Cancelar</button>
                            <button type="submit" class="botao-cadastrar-cad-cliente">Criar minha conta</button>
                        </div>

                        <div class="links-rodape-form-cad-cliente">
                            <a onclick="carregarPagina('login')">Já tenho uma conta</a>
                            <a onclick="carregarPagina('ajuda')">Precisa de ajuda?</a>
                        </div>

                        <p class="texto-termos-cad-cliente">
                            Ao se cadastrar, você concorda com os <a href="#" onclick="mostrarTermos(); return false;">Termos de Uso</a> e a <a href="#" onclick="mostrarTermos(); return false;">Política de Privacidade</a> da Bons Momentos.
                        </p>

                    </form>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
