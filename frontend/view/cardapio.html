<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bons Momentos - Cardápio</title>

    <!--Importações-->
    <!--<script src="../javascript/script.js" defer></script>-->
    <link rel="stylesheet" href="../css/styleCardapio.css">
    <link rel="stylesheet" href="../css/styleGlobal.css">

</head>
<body>
    <section class="section-carrossel">
        <div class="content-section">
            <div class="carrossel" id="carrossel">
                <button class="carrossel-seta carrossel-seta-esq" onclick="moverCarrossel(-1)">‹</button>

                <div class="carrossel-viewport">
                    <div class="carrossel-trilho" id="carrossel-trilho">
                        <div class="carrossel-slide">
                            <img  src="./img/img_1.png" alt="Destaque 1">
                        </div>
                        <div class="carrossel-slide">
                            <img src="./img/img_2.png" alt="Destaque 2">
                        </div>
                        <div class="carrossel-slide">
                            <img src="./img/img_3.png" alt="Destaque 3">
                        </div>
                        <div class="carrossel-slide">
                            <img src="./img/img_4.png" alt="Destaque 4">
                        </div>
                    </div>
                </div>

                <button class="carrossel-seta carrossel-seta-dir" onclick="moverCarrossel(1)">›</button>

                <div class="carrossel-indicadores">
                    <span class="indicador ativo" onclick="irParaSlide(0)"></span>
                    <span class="indicador" onclick="irParaSlide(1)"></span>
                    <span class="indicador" onclick="irParaSlide(2)"></span>
                    <span class="indicador" onclick="irParaSlide(3)"></span>
                </div>
            </div>
        </div>
    </section>

    <section class="section-pesquisa">
        <div class="content-section pesquisa">
            <div class="barra_de_pesquisa">
                <input type="text" name="" id="input-buscar-receita" placeholder="Buscar por nome da receita...">
            </div>
            <button id="filtro_pesquisa">Pesquisar</button>
        </div>
    </section>

    <!-- Henrique 26/10/2026 - Section responsável por receber as receitas dinamicamente -->
    <section>
        <div class="texto-mostruario content-section">
            <p class="titulo-mostruario">Receitas Disponíveis</p>
            <p class="subtitulo-mostruario">X receitas encontradas</p>

            <!-- Cards das receitas gerados via JS -->
            <section class="catalogo" id="catalogo-receitas">
                <!-- Os cards serão injetados aqui -->
            </section>
        </div>
    </section>

</body>
</html>
